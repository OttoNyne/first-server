services:
  - type: web
    name: first-server
    runtime: node
    plan: free
    # Only deploy a commit once its GitHub Actions CI run has passed.
    autoDeployTrigger: checksPass
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: LIVE_ICE_SERVERS
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVE_MAX_LISTENERS
        sync: false
      - key: REQUIRE_VERIFIED_EMAIL
        sync: false
      # Comma-separated email addresses of the site's moderators (each must also be confirmed on the account). Without it nobody can use the moderation review screen.
      - key: ADMIN_EMAILS
        sync: false
      # Push notifications: a key pair made with `npx web-push generate-vapid-keys`, and VAPID_SUBJECT as a mailto: or https address that says who is sending. Without all three nothing is pushed.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
